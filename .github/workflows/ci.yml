name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Shell syntax
        run: bash -n scripts/build_app.sh scripts/release.sh
      - name: Regression tests
        run: swift test
      - name: Universal release build
        run: swift build -c release --arch arm64 --arch x86_64
